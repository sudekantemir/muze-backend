<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Sanat Eseri Rehberi</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        .main-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        /* Masaüstünde Yan Panel */
        #ui-panel {
            width: 380px;
            height: 100%;
            padding: 20px;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            overflow-y: auto;
        }

        #viewer { flex-grow: 1; height: 100%; position: relative; }

        h2 { color: #4caf50; margin: 0 0 10px 0; font-size: 1.4rem; }
        label { font-size: 0.85rem; color: #bbb; }
        input, select, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; }
        button { background-color: #4caf50; border: none; cursor: pointer; font-weight: bold; margin-top: 5px; }

        #aiResponse {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #4caf50;
            font-size: 13px;
            display: none;
        }

        /* --- MOBİL DÜZENLEME (Panel Kısaltıldı) --- */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }

            /* Üst paneli kısalttık */
            #ui-panel {
                width: 100%;
                height: 45vh; /* Panel ekranın %35'i kadar (Daha kısa) */
                order: 1;
                padding: 15px;
            }

            /* Model alanını büyüttük */
            #viewer {
                width: 100%;
                height: 65vh; /* Model ekranın %65'i kadar (Daha geniş) */
                order: 2;
            }

            h2 { font-size: 1.1rem; }
            input, select, button { padding: 8px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div id="ui-panel">
            <select id="modelList">
            <option value="kiz_kulesi.glb">Kız Kulesi</option>
            <option value="galata_kulesi.glb">Galata Kulesi</option>
            <option value="efes_kutuphanesi.glb">Efes Kütüphanesi</option>
            <option value="nemrut.glb">Nemrut Dağı</option>
            <option value="peri_bacalari.glb">Peri Bacaları</option>
            <option value="truva_ati.glb">Truva Atı</option>
            <option value="artemis.glb">Artemis Tapınağı</option>
            <option value="aslanli_yol.glb">Aslanlı Yol</option>
            <option value="dolmabahce.glb">Dolmabahçe </option>
            <option value="hierapolis_antik_tiyatro.glb">Hierapolis Antik Tiyatro</option>
            <option value="hitit_gunes_kursu_aniti.glb">Hitit Güneş Kursu Anıtı</option>
            <option value="knidos_aslani.glb">Knidos Aslanı</option>
            <option value="ahlat.glb">Ahlat Selçuklu Mezarlığı</option>
        </select>
            <label>Soru Sorun:</label>
            <input type="text" id="userQuestion" placeholder="Örn: Bu eser ne zaman yapıldı?">
            <button id="askBtn">Yapay Zekaya Sor</button>
            <div id="aiResponse"></div>
        </div>
        <div id="viewer"></div>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
